# MangoHud overlay; loaded in every Vulkan game via MANGOHUD=1 (environment.d/gaming.conf)

# Layout
position=top-left
hud_compact
font_size=20
background_alpha=0.5
round_corners=5
table_columns=3

# Frame rate and pacing
fps
frametime
frame_timing
fps_limit=144,60,0
fps_limit_method=late
show_fps_limit

# GPU (VRAM is the 3070's bottleneck)
gpu_stats
gpu_temp
gpu_power
vram

# CPU and RAM
cpu_stats
cpu_temp
ram

# Network
network=enp42s0

# Context
wine
engine_version
resolution

# Keys: Shift_R+F12 toggles the HUD, Shift_L+F1 cycles the fps limit (144 → 60 → unlimited)
toggle_hud=Shift_R+F12
toggle_fps_limit=Shift_L+F1

# Don't draw on non-game Vulkan apps
blacklist=zenity,protonplus,lsfg-vk-ui,pamac-manager,lact,ghb,bitwig-studio
