"$schema" = 'https://starship.rs/config-schema.json'

format = """($status$cmd_duration )$fill
[(\\($username$hostname\\) )](bright-black)$directory$python($git_branch$git_status )$git_state$character"""

[username]
format = "[$user]($style)"
style_user = "bright-black"

[hostname]
format = "[@$hostname]($style)"
style = "bright-black"

[directory]
style = "blue"
truncation_length = 5
truncate_to_repo = true
read_only = " [ro]"
truncation_symbol = ".../"

[line_break]
disabled = true

[character]
success_symbol = "[>](purple)"
error_symbol = "[>](red)"
vimcmd_symbol = "[<](green)"

[python]
format = '[(${version} )(\($virtualenv\) )]($style)'
style = "yellow"
detect_files = []
detect_extensions = []
detect_folders = []

[git_branch]
format = "[$branch]($style)"
style = "green"

[git_status]
format = '( [$all_status$ahead_behind]($style))'
style = "cyan"
renamed = "r"
deleted = "x"
ahead = "⇡"
behind = "⇣"
diverged = "⇣⇡"

[status]
disabled = false
format = "[exit $status]($style) "
style = "red"

[fill]
symbol = "-"
style = "bright-black"

[cmd_duration]
min_time = 0
show_milliseconds = true
format = "[$duration]($style)"
style = "bright-black"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

