onboarding = false

[keys]
prefix = "ctrl+space"
# s is taken by split_horizontal below
settings = "prefix+comma"
# agents
goto = ["prefix+space", "ctrl+alt+space"]
open_notification_target = "prefix+o"
next_agent = "ctrl+alt+j"
previous_agent = "ctrl+alt+k"
# workspaces
next_workspace = "ctrl+alt+n"
previous_workspace = "ctrl+alt+p"
workspace_picker = ["prefix+w", "ctrl+alt+w"]
new_workspace = "prefix+shift+n"
close_workspace = "prefix+shift+d"
# worktrees (remove keeps the branch)
new_worktree = "prefix+g"
open_worktree = "prefix+shift+g"
remove_worktree = "prefix+ctrl+g"
# tabs
switch_tab = ["prefix+1..9", "ctrl+alt+1..9"]
previous_tab = ["prefix+left", "ctrl+alt+["]
next_tab = ["prefix+right", "ctrl+alt+]"]
new_tab = "prefix+t"
close_tab = "prefix+shift+x"
# panes
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
split_vertical = "prefix+v"
split_horizontal = "prefix+s"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+m"
toggle_sidebar = "prefix+b"

[[keys.command]]
key = "prefix+shift+c"
type = "shell"
command = 'code "${HERDR_ACTIVE_PANE_CWD:-.}"'
description = "open pane cwd in VS Code"

[ui]
status_indicators = "symbols"

[theme]
name = "gruvbox"
auto_switch = false
